[project]
name = "math-notes-tools"
version = "0.1.0"
description = "Build tooling for the Math Notes Quarto site"
requires-python = ">=3.11"
dependencies = [
  "pygments>=2.19,<3",
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "beautifulsoup4>=4.13",
  "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
